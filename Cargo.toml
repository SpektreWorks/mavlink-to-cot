[package]
name = "mavlink-to-cot"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
keywords = ["mavlink", "cot"]
categories = ["aerospace::drones", "aerospace::unmanned-aerial-vehicles"]

[dependencies]
egm96 = {version = "0.2.3", optional = true}
egm2008 = {version = "0.1.0", optional = true}
env_logger = "0.11.11"
futures = "0.3.34"
log = "0.4.33"
mavlink = {version = "0.18.0", default-features = false, features = [ "std", "mav2-message-extensions", "transport-tcp", "transport-udp", "transport-direct-serial", "dialect-ardupilotmega", "dialect-common", "tokio"]}
num-traits = "0.2.19"
tokio = {version = "1.53.1", features = [ "full" ] }
tokio-macros = "2.7.2"
chrono = {version = "0.4.45", default-features = false, features = ["alloc", "std"]}
config = {version = "0.15.25", default-features = false, features = ["toml"]}
serde = {version = "1.0.229", features = ["derive"]}
uas-cot = {version = "0.4.0", default-features = false}

[features]
default = ["egm2008"]
egm2008 = ["dep:egm2008"]
egm96 = ["dep:egm96"]

[target.'cfg(target_os="linux")'.dependencies]
landlock = "0.4.7"
